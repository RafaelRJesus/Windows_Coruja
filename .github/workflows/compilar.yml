# Compila a Coruja no Windows a cada envio e gera o Coruja.exe.
# Ao criar uma tag v* (ex.: v1.0.0), publica o .exe na página de Releases.
name: Compilar

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compilar:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Verificar a lógica
        run: dotnet run --project tests/LogicCheck -c Release

      - name: Gerar o Coruja.exe
        run: >
          dotnet publish src/Coruja/Coruja.csproj -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o out

      - name: Guardar o executável
        uses: actions/upload-artifact@v4
        with:
          name: Coruja
          path: out/Coruja.exe

      - name: Publicar a versão
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/Coruja.exe
          generate_release_notes: true
